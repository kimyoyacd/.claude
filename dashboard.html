<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MaxOS Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #f5f5f5;
        }

        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 5px;
        }

        .header .info {
            font-size: 12px;
            opacity: 0.9;
        }

        .dashboard-wrapper {
            flex: 1;
            overflow: auto;
            padding: 20px;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            background: white;
        }

        .refresh-indicator {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: white;
            padding: 12px 16px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            font-size: 12px;
            color: #666;
            z-index: 1000;
        }

        .refresh-indicator.refreshing {
            background: #667eea;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 MaxOS Dashboard</h1>
            <div class="info">
                workspace 리포지토리에서 자동으로 최신 버전을 로드합니다
                <span id="lastUpdate">로딩 중...</span>
            </div>
        </div>
        <div class="dashboard-wrapper">
            <iframe id="dashboard" src="https://htmlpreview.github.io/?https://github.com/kimyoyacd/workspace/blob/main/.claude/projects/maxos-dashboard-v5.html"></iframe>
        </div>
    </div>

    <div class="refresh-indicator" id="refreshIndicator">
        ⏱ 다음 새로고침: <span id="nextRefresh">1시간</span>
    </div>

    <script>
        const REFRESH_INTERVAL = 3600000; // 1시간 (3600000ms)
        const dashboard = document.getElementById('dashboard');
        const refreshIndicator = document.getElementById('refreshIndicator');
        const nextRefresh = document.getElementById('nextRefresh');
        const lastUpdate = document.getElementById('lastUpdate');

        // 초기 로드 시간 표시
        function updateLastRefreshTime() {
            const now = new Date();
            lastUpdate.textContent = `(마지막 업데이트: ${now.toLocaleTimeString('ko-KR')})`;
        }

        // 남은 시간 계산 및 표시
        function updateNextRefreshTime() {
            const now = new Date();
            const nextHour = new Date(now.getTime() + REFRESH_INTERVAL);
            const minutes = Math.floor((REFRESH_INTERVAL - (now.getTime() % REFRESH_INTERVAL)) / 60000);

            if (minutes > 60) {
                nextRefresh.textContent = `${Math.floor(minutes / 60)}시간 ${minutes % 60}분`;
            } else {
                nextRefresh.textContent = `${minutes}분`;
            }
        }

        // 대시보드 새로고침
        function refreshDashboard() {
            refreshIndicator.classList.add('refreshing');
            refreshIndicator.textContent = '🔄 새로고침 중...';

            // iframe src를 재할당해 강제로 다시 로드
            dashboard.src = dashboard.src;

            setTimeout(() => {
                refreshIndicator.classList.remove('refreshing');
                updateLastRefreshTime();
                updateNextRefreshTime();
            }, 1000);
        }

        // 초기화
        updateLastRefreshTime();
        updateNextRefreshTime();

        // 매 시간마다 새로고침
        setInterval(refreshDashboard, REFRESH_INTERVAL);

        // 매 분마다 남은 시간 업데이트
        setInterval(updateNextRefreshTime, 60000);

        // 수동 새로고침을 위한 단축키 (Ctrl+R 또는 Cmd+R)
        document.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === 'r') {
                e.preventDefault();
                refreshDashboard();
            }
        });
    </script>
</body>
</html>
